<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>S5X™_OWNER SHANTO 💸❤️‍🩹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }
    #splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s ease, visibility 0.9s ease;
      pointer-events: none;
    }
    #splash-overlay.hide-splash {
      opacity: 0;
      visibility: hidden;
    }
    .splash-glow {
      font-size: clamp(1.4rem, 7vw, 3.2rem);
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 30px #ff8800, 0 0 70px #ff4400;
      text-align: center;
      padding: 0 20px;
      line-height: 1.5;
      letter-spacing: 3px;
    }
    .splash-sub {
      margin-top: 24px;
      font-size: clamp(0.8rem, 2.8vw, 1.3rem);
      color: #00d9ff;
      letter-spacing: 6px;
      font-weight: 700;
    }
    .splash-loader {
      margin-top: 36px;
      width: 160px;
      height: 4px;
      background: #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
    }
    .splash-loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4400, #ffcc00, #00d9ff);
      animation: loadBar 4s linear forwards;
    }
    @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }

    #game-frame {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; background: #000;
    }
    #hack-widget {
      position: fixed;
      bottom: 30px; right: 30px;
      width: 420px; max-height: 88vh;
      z-index: 9998;
      background: rgba(10, 10, 15, 0.97);
      border-radius: 24px;
      border: 2px solid #ffcc00;
      box-shadow: 0 0 60px rgba(255, 204, 0, 0.25);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #hack-widget.minimized {
      width: 68px; height: 68px; border-radius: 50%; cursor: pointer; border: 2.5px solid #ffcc00;
    }
    #hack-widget.minimized .widget-header,
    #hack-widget.minimized .widget-body { display: none; }
    #hack-widget.minimized .minimized-badge { display: flex; }
    .minimized-badge {
      display: none; font-size: 14px; font-weight: 900; color: #ffcc00;
      align-items: center; justify-content: center; width: 100%; height: 100%; flex-direction: column;
    }
    .minimized-badge small { font-size: 7px; opacity: 0.7; }
    .widget-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: rgba(0, 0, 0, 0.7); border-bottom: 1px solid rgba(255, 204, 0, 0.2);
    }
    .widget-title { color: #ffcc00; font-size: 10px; font-weight: 900; }
    .widget-controls { display: flex; gap: 5px; }
    .widget-controls button {
      background: transparent; border: 1px solid rgba(255, 204, 0, 0.3); color: #ffcc00;
      border-radius: 50%; width: 24px; height: 24px; font-size: 9px; cursor: pointer;
    }
    .widget-body { padding: 12px; overflow-y: auto; flex: 1; }
    .hack-timer {
      text-align: center; background: rgba(0, 0, 0, 0.5); padding: 4px;
      border-radius: 10px; border: 1px solid rgba(255, 204, 0, 0.3); margin-bottom: 6px;
    }
    .hack-timer .timer-val { font-size: 20px; font-weight: 900; color: #ffcc00; }
    .hack-modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 6px; }
    .hack-modes button {
      background: #1a1a2e; color: #888; border: 1px solid #333; padding: 6px; font-size: 8px; font-weight: 700; border-radius: 8px; cursor: pointer;
    }
    .hack-modes button.active { background: #ffcc00; color: #000; border-color: #ffcc00; }
    .hack-prediction {
      text-align: center; padding: 10px; background: rgba(0, 0, 0, 0.5); border-radius: 12px; border: 1px solid rgba(255, 204, 0, 0.15);
    }
    .hack-prediction .period { font-size: 8px; color: #ffcc00; }
    .hack-prediction .result { font-size: 34px; font-weight: 900; color: #ffcc00; margin: 3px 0; }
    .hack-prediction .result.skip { color: #ff4d6d !important; }
    .hack-prediction .sub { font-size: 12px; font-weight: 700; color: #ffcc00; }
    .hack-prediction .trend { font-size: 8px; color: #ffcc00; margin-top: 3px; }
    .hack-prediction .confidence { font-size: 8px; color: #00ff66; margin-top: 2px; }
    .pattern-box { margin-top: 6px; padding: 6px; border-radius: 8px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 204, 0, 0.1); }
    .pattern-box .pattern-value { font-size: 11px; font-weight: 900; color: #ffcc00; }
    .pattern-box .pattern-analysis { font-size: 7px; color: #aaa; margin-top: 2px; text-align: left; padding: 3px; background: rgba(0,0,0,0.3); border-radius: 4px; }
    .api-status { font-size: 7px; color: #888; text-align: center; margin-top: 4px; }
    .api-status.connected { color: #00ff66; }
    .api-status.disconnected { color: #ff6b6b; }
    .api-status.syncing { color: #ffcc00; }
    @media (max-width: 480px) {
      #hack-widget { width: 310px; bottom: 10px; right: 10px; }
    }
  </style>
</head>
<body>

  <div id="splash-overlay">
    <div class="splash-glow">S5X™_OWNER SHANTO 💸❤️‍🩹</div>
    <div class="splash-sub">FAST ADAPT PERIOD SYNC V2.2</div>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  </div>

  <iframe id="game-frame" src="https://hgnice.org/#/register?invitationCode=57762259793"></iframe>

  <div id="hack-widget">
    <div class="minimized-badge">S5X™<small>VIP</small></div>
    <div class="widget-header">
      <span class="widget-title">⚡ S5X™_OWNER SHANTO</span>
      <div class="widget-controls">
        <button onclick="minimizeWidget()" id="minimize-btn">─</button>
      </div>
    </div>
    <div class="widget-body">
      <div class="hack-timer">
        <div class="timer-val" id="widget-timer">--s</div>
      </div>
      <div class="hack-modes">
        <button onclick="switchGameMode('30S')" id="wbtn-30S">🚀 WinGo 30S</button>
        <button class="active" onclick="switchGameMode('1M')" id="wbtn-1M">🔥 WinGo 1M</button>
      </div>
      <div class="hack-prediction">
        <div class="period" id="widget-period">PERIOD: --</div>
        <div class="result" id="widget-result">WAITING</div>
        <div class="sub" id="widget-sub">CONNECTING...</div>
        <div class="trend" id="widget-trend">📊 MARKET TREND</div>
        <div class="confidence" id="widget-confidence">🎯 Confidence: --%</div>
        <div class="pattern-box">
          <div class="pattern-value" id="widget-pattern">ANALYZING...</div>
          <div class="pattern-analysis" id="widget-analysis">Loading market data...</div>
        </div>
        <div class="api-status" id="api-status">🔌 Connecting to API...</div>
      </div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      const splash = document.getElementById('splash-overlay');
      splash.classList.add('hide-splash');
      setTimeout(() => { splash.style.display = 'none'; }, 900);
    }, 4000);

    const WINGO_APIS = {
      "30S": "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageNo=1&pageSize=50",
      "1M": "https://draw.ar-lottery01.com/WinGo/WinGo_1Min/GetHistoryIssuePage.json?pageNo=1&pageSize=50"
    };

    let activeGameMode = "1M";
    let engineActive = true;
    let lastProcessedIssue = "";
    let isMinimized = false;

    const colorRules = {
      0: { name: 'RED/VIOLET', hex: '#cc33ff' },
      1: { name: 'GREEN', hex: '#00c040' },
      2: { name: 'RED', hex: '#ff3333' },
      3: { name: 'GREEN', hex: '#00c040' },
      4: { name: 'RED', hex: '#ff3333' },
      5: { name: 'GREEN/VIOLET', hex: '#cc33ff' },
      6: { name: 'RED', hex: '#ff3333' },
      7: { name: 'GREEN', hex: '#00c040' },
      8: { name: 'RED', hex: '#ff3333' },
      9: { name: 'GREEN', hex: '#00c040' }
    };

    function advancedPatternAnalysis(historyList, nextIssueId) {
      const history = historyList.map(item => {
        const num = parseInt(item.number, 10);
        return num >= 5 ? "BIG" : "SMALL";
      });

      if (history.length < 3) {
        return { bs: "SKIP", num: 0, trend: "📊 COLLECTING DATA", color: "#ffaa00", confidence: 0, analysis: "Not enough history. Skipping." };
      }

      const recent = history.slice(0, 10);

      // ট্রেন্ড বা তান কাউন্ট (যেমন ২ বা ৩ বার টানা এক দিকে থাকলে)
      let streakCount = 0;
      let streakDirection = history[0];
      for (let i = 0; i < history.length; i++) {
        if (history[i] === streakDirection) streakCount++;
        else break;
      }

      // জিগজ্যাগ কাউন্ট (মাত্র ২টি পরিবর্তন পেলেই ধরে নেবে)
      let zigzagCount = 0;
      for (let i = 0; i < history.length - 1; i++) {
        if (history[i] !== history[i + 1]) zigzagCount++;
        else break;
      }

      let predictedBS = "BIG";
      let trendLabel = "📈 MARKET DYNAMICS";
      let trendColor = "#00f5a0";
      let confidence = 60;
      let analysis = "";
      let shouldSkip = false;

      if (streakCount >= 2) {
        predictedBS = streakDirection;
        trendLabel = `🔥 TREND ACTIVE (${streakDirection} x${streakCount})`;
        trendColor = "#f5b81b";
        confidence = 70;
        analysis = `Following active ${streakDirection} trend momentum.`;
      } else if (zigzagCount >= 2) {
        const last = history[0];
        predictedBS = (last === "BIG") ? "SMALL" : "BIG";
        trendLabel = `⚡ FAST ZIGZAG (${zigzagCount})`;
        trendColor = "#00b4d8";
        confidence = 65;
        analysis = `Detected alternation. Switching to ${predictedBS}.`;
      } else {
        let bigScore = 0;
        let smallScore = 0;
        const weights = [5, 4, 3, 2, 1];
        for (let i = 0; i < weights.length && i < recent.length; i++) {
          if (recent[i] === "BIG") bigScore += weights[i];
          else smallScore += weights[i];
        }

        // যদি স্কোর সমান বা কাছাকাছি থাকে, তবে ভুল ট্রেড এড়াতে SKIP করবে
        if (Math.abs(bigScore - smallScore) <= 1) {
          shouldSkip = true;
        } else {
          predictedBS = (bigScore >= smallScore) ? "BIG" : "SMALL";
          confidence = 55;
          analysis = "Weighted calculation applied.";
        }
      }

      if (shouldSkip) {
        return { bs: "SKIP", num: 0, trend: "⚠️ UNSTABLE MARKET", color: "#ff4d6d", confidence: 0, analysis: "Accuracy mismatch. Skipping round to protect balance." };
      }

      let seed = 0;
      for (let i = 0; i < nextIssueId.length; i++) {
        seed = ((seed << 5) - seed) + nextIssueId.charCodeAt(i);
        seed |= 0;
      }
      const numEntropy = Math.abs(Math.sin(seed * 9999));
      const eligibleNums = (predictedBS === "BIG") ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
      let luckyNum = eligibleNums[Math.floor(numEntropy * eligibleNums.length)];
      let colorInfo = colorRules[luckyNum] || { name: 'UNKNOWN', hex: '#ffffff' };

      return {
        bs: predictedBS,
        num: luckyNum,
        colorName: colorInfo.name,
        colorHex: (luckyNum === 0 || luckyNum === 5) ? '#cc33ff' : colorInfo.hex,
        trend: trendLabel,
        color: trendColor,
        confidence: Math.min(Math.max(confidence, 40), 95),
        analysis
      };
    }

    async function fetchAndAnalyzeMarket() {
      if (!engineActive) return;
      const apiUrl = WINGO_APIS[activeGameMode];
      if (!apiUrl) return;
      const statusEl = document.getElementById('api-status');

      try {
        const response = await fetch(apiUrl);
        const json = await response.json();
        if (!json || !json.data || !json.data.list || json.data.list.length === 0) return;

        const latestItem = json.data.list[0];
        const currentIssue = latestItem.issueNumber;
        const nextIssueId = (BigInt(currentIssue) + 1n).toString();

        if (lastProcessedIssue !== nextIssueId) {
          lastProcessedIssue = nextIssueId;
          const result = advancedPatternAnalysis(json.data.list, nextIssueId);
          updateWidgetDisplay(result, nextIssueId);
          statusEl.textContent = `✅ Live Synced (${nextIssueId.slice(-5)})`;
          statusEl.className = 'api-status connected';
        }
      } catch (err) {
        statusEl.textContent = '⚠️ API Error - retrying...';
        statusEl.className = 'api-status disconnected';
      }
    }

    function updateWidgetDisplay(prediction, periodId) {
      document.getElementById('widget-period').textContent = `PERIOD: ${periodId}`;
      const resultEl = document.getElementById('widget-result');
      const subEl = document.getElementById('widget-sub');
      const trendEl = document.getElementById('widget-trend');
      const confidenceEl = document.getElementById('widget-confidence');
      const patternEl = document.getElementById('widget-pattern');
      const analysisEl = document.getElementById('widget-analysis');

      if (prediction.bs === 'SKIP') {
        resultEl.textContent = '⏭️ SKIP';
        resultEl.className = 'result skip';
        subEl.textContent = '⏳ WAITING MARKET';
        confidenceEl.textContent = '🎯 Confidence: 0%';
        trendEl.textContent = prediction.trend;
        patternEl.textContent = '⚠️ UNSTABLE MARKET';
        analysisEl.textContent = prediction.analysis;
        return;
      }

      resultEl.textContent = prediction.bs;
      resultEl.className = 'result';
      resultEl.style.color = prediction.colorHex;
      subEl.textContent = `${prediction.num} (${prediction.colorName})`;
      subEl.style.color = prediction.colorHex;
      trendEl.textContent = prediction.trend;
      confidenceEl.textContent = `🎯 Confidence: ${Math.round(prediction.confidence)}%`;
      patternEl.textContent = prediction.bs === 'BIG' ? '📈 BULLISH TREND' : '📉 BEARISH TREND';
      analysisEl.textContent = prediction.analysis;
    }

    function getTimerRemaining() {
      const seconds = new Date().getSeconds();
      return activeGameMode === "1M" ? (60 - seconds) : (30 - (seconds % 30));
    }

    setInterval(() => {
      const remaining = getTimerRemaining();
      document.getElementById('widget-timer').textContent = `${remaining}s`;
      if (remaining === 60 || remaining === 30 || remaining === 1) {
        fetchAndAnalyzeMarket();
      }
    }, 1000);

    function switchGameMode(newMode) {
      if (WINGO_APIS[newMode]) {
        activeGameMode = newMode;
        lastProcessedIssue = "";
        document.querySelectorAll('.hack-modes button').forEach(b => b.classList.remove('active'));
        document.getElementById('wbtn-' + newMode).classList.add('active');
        fetchAndAnalyzeMarket();
      }
    }

    function minimizeWidget() {
      const widget = document.getElementById('hack-widget');
      isMinimized = !isMinimized;
      widget.classList.toggle('minimized');
      document.getElementById('minimize-btn').textContent = isMinimized ? '□' : '─';
    }

    // প্রথম লোডেই কল হবে
    fetchAndAnalyzeMarket();
  </script>
</body>
</html>
